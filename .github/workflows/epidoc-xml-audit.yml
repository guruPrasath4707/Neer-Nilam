name: EpiDoc XML audit utility

on:
  push:
    branches:
      - feat/epidoc-xml-audit-v0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-utility-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies when a manifest is present
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
